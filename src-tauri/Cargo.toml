[package]
name = "marktplaner"
version = "0.1.0"
description = "Marktplan-Editor für Märkte und Feste"
authors = ["Laurin Ludwig"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/LaurinLudwig/Marktplaner"
edition = "2021"

[lib]
name = "marktplaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
