# Veröffentlicht eine Version: Tag vX.Y.Z pushen (gleich der Version in package.json, tauri.conf.json, Cargo.toml).
# Ablauf: prüfen → Entwurf eines GitHub-Release anlegen → Installer für Windows und macOS bauen und anhängen
# → Release veröffentlichen. Schlägt ein Build fehl, bleibt der Entwurf liegen (im Reiter „Releases“ löschen).
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prüfen und Release-Entwurf anlegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Version des Tags mit der App-Version vergleichen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "Tag $tag, package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] || { echo "::error::Tag passt nicht zur App-Version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Marktplaner ${GITHUB_REF_NAME#v}" \
            --notes "Installer: Windows \`.msi\` oder \`-setup.exe\`, macOS \`.dmg\` (Apple Silicon und Intel). Die Installer sind nicht signiert; beim ersten Öffnen warnt das Betriebssystem (siehe README, „Installation“)."

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ''
            tauri-args: --bundles msi,nsis
            files: src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Tauri-Build
        run: npm run tauri build -- ${{ matrix.tauri-args }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Installer an das Release hängen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

  publish:
    name: Release veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
